<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Ocqs12gO4cc+Nh57MggJxAsd5N34Kd4B8p+EZsTaiXI='; style-src 'unsafe-inline'; connect-src https://naman.world http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT-2 BPE tokenization</title>
<style>
:root{color-scheme:light;--paper:#f8f7f3;--ink:#292b28;--muted:#777b73;--line:#dddfd6;--accent:#647650;--sage:#e4ebd9;--lavender:#e8e3f0;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button,select{cursor:pointer}button:disabled{cursor:default;opacity:.35}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}main{max-width:1120px;margin:auto;padding:24px 40px 28px}.top{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}.eyebrow{font:10px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}h1{font-size:20px;font-weight:500;letter-spacing:-.4px;line-height:1.3;margin:0}.input-row{display:flex;align-items:center;gap:14px;margin-bottom:28px}.input-row label{font-size:12px;color:var(--muted);flex:none}.input-wrap{display:flex;flex:1;max-width:430px;gap:8px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:5px 5px 5px 13px}input{min-width:0;flex:1;background:none;border:0;outline:none;font:14px var(--mono);color:var(--ink)}button{border:1px solid var(--line);background:transparent;border-radius:5px;padding:9px 13px;color:var(--ink);font-size:12px;transition:background .15s}button:hover:not(:disabled){background:#ebede5}.input-wrap button{padding:7px 10px;background:var(--paper)}.canvas{border:1px solid var(--line);border-radius:9px;background:#fffefa;overflow:hidden}.stage-top{display:flex;justify-content:space-between;padding:20px 24px;font:11px var(--mono);color:var(--muted)}.step-number{color:var(--ink)}.token-area{min-height:190px;display:flex;align-items:center;justify-content:center;padding:25px 24px 46px;overflow:auto;background-image:radial-gradient(#e8e8df .8px,transparent .8px);background-size:16px 16px}.tokens{display:flex;gap:7px;align-items:center;min-width:min-content;margin:auto}.token{position:relative;flex:none;min-width:49px;height:64px;padding:0 13px;display:flex;align-items:center;justify-content:center;font:21px var(--mono);background:#f4f3ee;border:1px solid #d9dbd1;border-radius:5px;transition:background .25s,border-color .25s,box-shadow .25s}.token small{position:absolute;top:75px;left:0;right:0;text-align:center;font:9px var(--mono);color:#8b8e86}.token.merged{background:var(--lavender);border-color:#cfc5df}.token.chosen{background:var(--sage);border-color:#8c9d76;box-shadow:0 0 0 3px #e4ebd955}.token.chosen.first:after{content:'+';position:absolute;right:-9px;z-index:2;font:12px var(--mono);background:var(--sage);border-radius:50%;width:11px;text-align:center;color:#586b43}.explanation{min-height:62px;border-top:1px solid var(--line);display:flex;justify-content:center;align-items:center;gap:8px;padding:14px 24px;font-size:13px;line-height:1.6;text-align:center}.explanation code{font:12px var(--mono);background:var(--sage);padding:4px 7px;border-radius:3px}.transport{display:flex;align-items:center;gap:8px;padding:16px 24px;border-top:1px solid var(--line);background:#f6f6f0}.play{background:#343e2c;color:white;border-color:#343e2c;min-width:96px}.play:hover:not(:disabled){background:#4b5a3f}.icon-button{width:36px;height:35px;padding:8px;display:grid;place-items:center}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.progress{height:3px;background:#dfe3d7;flex:1;margin:0 14px;border-radius:2px;overflow:hidden}.progress span{display:block;height:100%;background:#8e9f76;width:0;transition:width .35s}.speed{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}select{border:0;background:transparent;color:var(--ink);font-size:12px;padding:6px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:42px;margin-top:30px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-title h2{font-weight:500;font-size:13px;margin:0}.subtle{font:10px var(--mono);color:var(--muted)}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.rule{padding:11px 9px;border:1px solid var(--line);border-radius:4px;display:flex;gap:9px;align-items:center;transition:background .25s,border-color .25s}.rule .rank{font:10px var(--mono);color:#9a9f92}.rule code{font:11px var(--mono);white-space:nowrap}.rule.active{border-color:#94a77a;background:var(--sage)}.readout{background:#eeece5;border-radius:5px;padding:15px 17px;font:13px/1.8 var(--mono);min-height:83px;overflow-wrap:anywhere}.readout span{color:#717768}.validation{color:#9a4536;font-size:12px;margin-top:-17px;margin-bottom:18px}.validation:empty{display:none}
@media(max-width:700px){main{padding:24px 18px}.input-row{gap:10px}.bottom{grid-template-columns:1fr;gap:22px}.token-area{justify-content:flex-start;padding-left:18px;padding-right:18px}.token{min-width:37px;padding:0 9px;font-size:17px}.tokens{gap:5px}.stage-top,.transport{padding:16px}.progress{margin:0 4px}.speed>span{display:none}.explanation{font-size:12px;padding:12px;flex-wrap:wrap;gap:4px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

.piece-strip{padding:0 24px 18px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}.piece-strip .eyebrow{font-size:9px}#pieces{display:flex;flex-wrap:wrap;gap:5px}#pieces span{font:11px var(--mono);padding:5px 7px;border-radius:3px;border:1px solid var(--line);white-space:pre-wrap}#pieces .active{background:var(--sage);border-color:#9bab87}.tokens{flex-wrap:wrap;min-width:0;justify-content:center;row-gap:34px;width:100%}.token-area{max-height:320px;min-height:180px;align-items:flex-start}.token{font-size:17px;min-width:38px;padding:0 9px;height:54px;max-width:100%;overflow-wrap:anywhere}.token small{top:62px}.token.piece-start{margin-left:13px;border-left-width:3px}.rules{grid-template-columns:repeat(2,minmax(0,1fr));color:var(--muted);font-size:12px}.rule{min-width:0}.rule code{white-space:normal;overflow-wrap:anywhere;font-size:11px}.rule .rank{min-width:35px}.piece-strip+.token-area{border-top:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <header class="top"><h1>GPT-2 BPE tokenization</h1></header>
  <form id="input-form" class="input-row"><label for="input">Your text</label><div class="input-wrap"><input id="input" value="my name is naman" maxlength="160" autocomplete="off" spellcheck="false" aria-describedby="input-error"><button type="submit">Encode ↗</button></div></form>
  <p id="input-error" class="validation" role="alert"></p>
  <section class="canvas" aria-label="BPE encoding animation">
    <div class="stage-top"><span id="step" class="step-number"></span><span id="count"></span></div>
    <div class="piece-strip"><span class="eyebrow">Text pieces</span><div id="pieces"></div></div><div class="token-area"><div id="tokens" class="tokens" aria-label="Current tokens"></div></div>
    <div id="explanation" class="explanation" aria-live="polite"></div>
    <div class="transport">
      <button id="reset" class="icon-button" aria-label="Restart"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6a7 7 0 1 1-1 6M4 2v4h4"/></svg></button>
      <button id="back" class="icon-button" aria-label="Previous merge"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4v12M15 4l-8 6 8 6z"/></svg></button>
      <button id="play" class="play">▶ Play</button>
      <button id="next" class="icon-button" aria-label="Next merge"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15 4v12M5 4l8 6-8 6z"/></svg></button>
      <div class="progress" role="progressbar" aria-label="Encoding progress" aria-valuemin="0" aria-valuemax="100" id="progress"><span id="progress-fill"></span></div>
      <label class="speed"><span>Speed</span><select id="speed" aria-label="Animation speed"><option value="2200">0.5×</option><option value="1100" selected>1×</option><option value="550">2×</option></select></label>
    </div>
  </section>
  <div class="bottom">
    <section><div class="section-title"><h2>Available merges</h2><span class="subtle">Always choose lowest rank</span></div><div id="rules" class="rules"></div></section>
    <section><div class="section-title"><h2>Token IDs</h2><span id="output-label" class="subtle"></span></div><div id="output" class="readout"></div></section>
  </div>
</main>
<script>
const API_URL = ['localhost', '127.0.0.1'].includes(location.hostname)
  ? new URL('/api/bpe', location.href).href : 'https://naman.world/api/bpe';
const visible = text => text;
const encoder = new TextEncoder();
const $ = id => document.getElementById(id);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let frames = [], position = 0, timer = null, busy = false, generation = 0;
let activeRequest = null;

function pause() { clearTimeout(timer); timer = null; $('play').textContent = '▶ Play'; }

function render(oldRects = new Map()) {
  const {tokens, candidate, pieces, byteLength} = frames[position];
  const selected = new Set(candidate?.indices.flatMap(i => [i, i + 1]) ?? []);
  $('tokens').replaceChildren(...tokens.map((token, i) => {
    const element = document.createElement('div');
    element.className = 'token' + (token.end - token.start > 1 ? ' merged' : '') +
      (selected.has(i) ? ' chosen' : '') +
      (candidate?.indices.includes(i) ? ' first' : '') +
      (i > 0 && tokens[i - 1].piece !== token.piece ? ' piece-start' : '');
    element.dataset.start = token.start;
    element.textContent = visible(token.text);
    element.setAttribute('aria-label', `${visible(token.text)}, token ID ${token.id}`);
    const id = document.createElement('small'); id.textContent = token.id; element.append(id);
    return element;
  }));
  $('step').textContent = position === frames.length - 1 ? 'Encoding complete' : `Merge ${position + 1} of ${frames.length - 1}`;
  $('count').textContent = `${byteLength} bytes → ${tokens.length} tokens`;
  $('output').textContent = '[ ' + tokens.map(token => token.id).join(', ') + ' ]';
  $('output-label').textContent = candidate ? '' : 'final output';
  $('explanation').replaceChildren();
  if (candidate) {
    const code = document.createElement('code');
    code.textContent = `${visible(candidate.left)} + ${visible(candidate.right)} → ${candidate.merged}`;
    $('explanation').append(code, `Rank ${candidate.rank.toLocaleString()} wins in piece ${candidate.piece + 1}.`);
  } else $('explanation').textContent = 'No more merges within the text pieces. These are the final GPT-2 tokens.';
  $('pieces').replaceChildren(...pieces.map((piece, i) => {
    const chip = document.createElement('span');
    chip.textContent = piece.replaceAll(' ', '␣').replaceAll('\n', '↵').replaceAll('\t', '⇥');
    chip.className = candidate?.piece === i ? 'active' : '';
    chip.title = `Piece ${i + 1}`;
    return chip;
  }));
  $('rules').replaceChildren(...(candidate?.choices.slice(0, 6) ?? []).map((choice, i) => {
    const row = document.createElement('div'); row.className = 'rule' + (i === 0 ? ' active' : '');
    const number = document.createElement('span'); number.className = 'rank'; number.textContent = choice.rank.toLocaleString();
    const pair = document.createElement('code'); pair.textContent = `${visible(choice.left)} + ${visible(choice.right)}`;
    row.append(number, pair); return row;
  }));
  if (!candidate) $('rules').textContent = 'All pieces are encoded.';
  $('back').disabled = position === 0;
  $('next').disabled = !candidate;
  const progress = frames.length === 1 ? 100 : 100 * position / (frames.length - 1);
  $('progress-fill').style.width = `${progress}%`;
  $('progress').setAttribute('aria-valuenow', Math.round(progress));
  if (!reducedMotion.matches) for (const element of $('tokens').children) {
    const old = oldRects.get(Number(element.dataset.start));
    if (!old) continue;
    const rect = element.getBoundingClientRect();
    element.animate([{transform:`translate(${old.left - rect.left}px, ${old.top - rect.top}px) scaleX(${old.width / rect.width})`},
      {transform:'translateX(0) scaleX(1)'}], {duration:380,easing:'cubic-bezier(.2,.8,.2,1)'});
  }
}

async function advance() {
  if (activeRequest || busy || position >= frames.length - 1) return;
  busy = true;
  const currentGeneration = generation;
  const rects = new Map(Array.from($('tokens').children, el => [Number(el.dataset.start), el.getBoundingClientRect()]));
  if (!reducedMotion.matches) {
    const pair = Array.from($('tokens').querySelectorAll('.chosen'));
    await Promise.all(pair.map((el, i) => el.animate([
      {transform:'translateX(0)',filter:'brightness(1)'},
      {transform:`translateX(${i % 2 ? -4 : 4}px)`,filter:'brightness(.95)'}
    ], {duration:220,fill:'forwards',easing:'ease-in'}).finished));
  }
  // Restarting or stepping back cancels any in-flight transition.
  if (currentGeneration !== generation) return;
  position++; render(rects); busy = false;
  if (position === frames.length - 1) pause();
}

function stepBack() { if (!frames.length || activeRequest) return; pause(); generation++; busy = false; position = Math.max(0, position - 1); render(); }
function restart() { if (!frames.length || activeRequest) return; pause(); generation++; busy = false; position = 0; render(); }
function play() {
  if (!frames.length || activeRequest) return;
  if (timer !== null) { pause(); return; }
  if (position === frames.length - 1) restart();
  if (frames.length === 1) return;
  $('play').textContent = 'Ⅱ Pause';
  const tick = async () => {
    const scheduled = timer;
    await advance();
    if (timer !== null && timer === scheduled) timer = setTimeout(tick, Number($('speed').value));
  };
  timer = setTimeout(tick, Number($('speed').value));
}

// Send only when requested, and cancel an older request before starting another.
async function encodeInput() {
  const value = $('input').value;
  if (!value.length || encoder.encode(value).length > 160) {
    $('input-error').textContent = 'Use between 1 and 160 UTF-8 bytes.'; return;
  }
  activeRequest?.abort();
  const controller = new AbortController();
  activeRequest = controller;
  pause(); generation++; busy = false;
  document.querySelectorAll('.transport button').forEach(button => button.disabled = true);
  $('input-error').textContent = '';
  $('step').textContent = 'Encoding…';
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetch(API_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:value}), credentials:'omit', signal:controller.signal,
    });
    if (response.status === 429) throw Error('Too many requests. Wait a minute, then try again.');
    const data = await response.json();
    if (!response.ok) throw Error(data.error || 'Encoding failed. Please try again.');
    if (data.model !== 'gpt2' || data.version !== 1 || !Array.isArray(data.frames) || !data.frames.length)
      throw Error('The tokenizer returned an unexpected response.');
    if (activeRequest !== controller) return;
    frames = data.frames; position = 0;
  } catch (error) {
    if (activeRequest !== controller) return;
    $('input-error').textContent = error.name === 'AbortError'
      ? 'Request timed out. Check your connection and try again.'
      : error instanceof TypeError ? 'Could not reach the tokenizer. Check your connection or wait a minute if rate-limited.' : error.message;
  } finally {
    clearTimeout(timeout);
    if (activeRequest === controller) {
      activeRequest = null;
      if (frames.length) {
        document.querySelectorAll('.transport button').forEach(button => button.disabled = false);
        render();
      } else $('step').textContent = 'Waiting for tokenizer';
    }
  }
}
$('input-form').addEventListener('submit', event => { event.preventDefault(); encodeInput(); });
$('play').addEventListener('click', play);
$('next').addEventListener('click', () => { pause(); advance(); });
$('back').addEventListener('click', stepBack);
$('reset').addEventListener('click', restart);
document.addEventListener('keydown', event => {
  if (event.target.closest('input, select, button, textarea') || event.altKey || event.metaKey || event.ctrlKey) return;
  if (event.code === 'Space') { event.preventDefault(); play(); }
  if (event.code === 'ArrowRight') { event.preventDefault(); pause(); advance(); }
  if (event.code === 'ArrowLeft') { event.preventDefault(); stepBack(); }
});
encodeInput();
</script>
</body>
</html>
